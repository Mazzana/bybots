name: Bug report
description: Report reproducible behavior that differs from the expected result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve ByBots. Do not include API keys, tokens, private conversations, or production logs containing personal data.
  - type: input
    id: version
    attributes:
      label: ByBots version or commit
      placeholder: v0.1.0 or 3a04701
    validations:
      required: true
  - type: input
    id: hermes-version
    attributes:
      label: Hermes version
      placeholder: 0.21.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Web
        - Electron
        - Bridge API
        - Hermes integration
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the smallest reliable sequence that triggers the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Share sanitized screenshots or logs only.
