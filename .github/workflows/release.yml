name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate version tag and stable signing credentials
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must equal v$version" }
          if (-not $version.Contains("-") -and (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD)) { throw "Windows signing secrets are required for a stable release" }

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm test

      - name: Build Electron main process
        run: npm run build:electron

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Build signed installer and portable application
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: npm run package:win

      - name: Build unsigned preview installer and portable application
        if: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-') }}
        shell: pwsh
        run: |
          Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
          Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          npm run package:win

      - name: Smoke-test packaged application
        run: npm run test:windows-package-smoke

      - name: Qualify signed Windows artifacts
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: npm run test:windows-artifacts:signed

      - name: Qualify unsigned preview artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-') }}
        run: npm run test:windows-artifacts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bybots-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.exe

  macos:
    name: Build macOS artifacts
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate version tag and stable Apple credentials
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must equal v$version"; exit 1; }
          case "$version" in
            *-*) ;;
            *)
              test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" || { echo "macOS signing secrets are required for a stable release"; exit 1; }
              test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Apple notarization secrets are required for a stable release"; exit 1; }
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Build Electron main process
        run: npm run build:electron

      - name: Run browser and macOS shell smoke tests
        run: npm run test:e2e

      - name: Build signed and notarized universal DMG and ZIP
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: npm run package:mac

      - name: Build unsigned preview universal DMG and ZIP
        if: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-') }}
        shell: bash
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npm run build
          npx electron-builder --mac dmg zip --universal --config.mac.notarize=false --publish never

      - name: Smoke-test packaged application
        run: npm run test:macos-package-smoke

      - name: Qualify signed and notarized macOS artifacts
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: npm run test:macos-artifacts:signed

      - name: Qualify preview macOS artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-') }}
        run: npm run test:macos-artifacts

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bybots-macos-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS-macos.txt
          if-no-files-found: error

      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/*.dmg
            release/*.zip

  publish:
    name: Publish multiplatform release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download qualified artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: bybots-*-${{ github.ref_name }}
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}"
