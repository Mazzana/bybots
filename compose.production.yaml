services:
  byfinity-bots:
    build:
      context: .
    image: byfinity-bots:${BYFINITY_BOTS_VERSION:-local}
    container_name: byfinity-bots
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.production
    environment:
      BYFINITY_HOST: 127.0.0.1
      BYFINITY_PORT: "4179"
      HERMES_URL: http://127.0.0.1:9119
      BYFINITY_CONFIG_FILE: /var/lib/byfinity-bots/config/connection.json
      BYFINITY_HERMES_EXCHANGE_DIR: /var/lib/byfinity-bots/exchange
    volumes:
      - ./data:/var/lib/byfinity-bots/config
      - ./exchange:/var/lib/byfinity-bots/exchange
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
